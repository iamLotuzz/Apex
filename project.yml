name: Apex

options:
  bundleIdPrefix: de.aslaframes
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Apex:
    type: application
    platform: iOS
    sources:
      - path: Apex
      - path: Shared
    dependencies:
      - target: ApexWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.aslaframes.apex
        PRODUCT_NAME: Apex
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Apex.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ApexWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ApexWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.aslaframes.apex.widget
        PRODUCT_NAME: ApexWidget
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/ApexWidget.entitlements
        SKIP_INSTALL: YES

schemes:
  Apex:
    build:
      targets:
        Apex: all
        ApexWidget: all
    run:
      config: Debug
    archive:
      config: Release
